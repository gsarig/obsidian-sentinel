name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      # Sign provenance attestations for the release assets, so the community
      # plugin directory can verify they were built by this workflow.
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            manifest-beta.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

            if [[ $tag == *"beta"* ]]; then
              gh release create "$tag" \
                --title="$tag" \
                --draft \
                --prerelease \
                main.js manifest-beta.json styles.css
            else
              gh release create "$tag" \
                --title="$tag" \
                --draft \
                main.js manifest.json styles.css
            fi
